# Grafana MySQL 数据源（provisioning 方式：随 compose 自动注册，可复现）
# uid 固定为 mysql-rt → dashboard JSON 里按 uid 引用
apiVersion: 1

datasources:
  - name: MySQL 实时数仓
    uid: mysql-rt
    type: mysql
    access: proxy
    url: mysql:3306
    database: gmall_report_rt
    user: root
    secureJsonData:
      password: "123456"
    jsonData:
      timezone: Asia/Shanghai
      maxOpenConns: 3
      maxIdleConns: 2
